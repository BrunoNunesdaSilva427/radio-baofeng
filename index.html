<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Baofeng 777S</title>
<style>
:root{--body:#1b1d22;--panel:#0f1013;--lcd:#9fb58a;--lcd-ink:#1d2a17;--key:#2a2d34;--key-hi:#3a3e47;--txt:#e7e9ee;--dim:#8a8f9c;--red:#e5483c;--grn:#58d36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0a0b0d;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.radio{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#22252b,var(--body) 30%);padding:0 18px 24px;position:relative}
.ant{height:70px;width:16px;margin:0 0 0 52px;background:linear-gradient(90deg,#0c0d0f,#2b2e35,#0c0d0f);border-radius:8px 8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 10px}
.led{width:14px;height:14px;border-radius:50%;background:#2a2d34;box-shadow:inset 0 1px 2px #000;transition:.1s}
.led.rx{background:var(--grn);box-shadow:0 0 12px var(--grn)}
.led.tx{background:var(--red);box-shadow:0 0 12px var(--red)}
.brand{font-weight:700;letter-spacing:.5px}
.brand small{display:block;font-weight:400;color:var(--dim);font-size:11px}
.lcd{background:var(--lcd);color:var(--lcd-ink);border:6px solid var(--panel);border-radius:10px;padding:10px 12px;font-family:"Courier New",monospace;box-shadow:inset 0 0 14px rgba(0,0,0,.35);min-height:112px}
.lcd .r{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.lcd .name{font-size:22px;font-weight:700;margin:8px 0 6px;line-height:1.1;min-height:48px;word-break:break-word}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:4px;background:var(--lcd-ink);opacity:.2}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:14px}
.bars i.on{opacity:1}
.prog{height:4px;background:rgba(29,42,23,.25);margin-top:6px}
.prog b{display:block;height:100%;width:0;background:var(--lcd-ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.key{background:var(--key);border:0;border-radius:12px;color:var(--txt);padding:14px 12px;min-height:78px;text-align:left;font:inherit;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 0 #0c0d0f,inset 0 1px 0 rgba(255,255,255,.07);touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.key:active,.key.act{transform:translateY(3px);box-shadow:0 1px 0 #0c0d0f}
.key.act{background:var(--key-hi);outline:2px solid var(--grn)}
.key .n{font-family:"Courier New",monospace;color:var(--dim);font-size:12px}
.key .l{font-size:16px;font-weight:600;line-height:1.2}
.foot{display:flex;gap:12px;margin-top:20px}
.foot button{flex:1;background:transparent;color:var(--dim);border:1px solid #363a43;border-radius:10px;padding:12px;font:inherit;font-size:14px}
.foot button.on{color:var(--txt);border-color:var(--grn)}
.hint{color:var(--dim);font-size:12px;margin:12px 4px 0;text-align:center;min-height:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="radio">
  <div class="ant"></div>
  <div class="top">
    <div class="brand">BAOFENG 777S<small>Rádio comunicador UHF</small></div>
    <div class="led" id="led"></div>
  </div>
  <section class="lcd" aria-live="polite">
    <div class="r"><span id="ch">CH--</span><span id="st">STANDBY</span><span class="bars" id="bars"><i></i><i></i><i></i><i></i></span></div>
    <div class="name" id="name">Selecione um canal</div>
    <div class="r"><span id="time">0:00</span><span>438.500 MHz</span></div>
    <div class="prog"><b id="prog"></b></div>
  </section>
  <section class="grid" id="grid"></section>
  <div class="foot">
    <button id="stop">Parar</button>
    <button id="edit">Editar nomes</button>
  </div>
  <p class="hint" id="hint"></p>
</main>

<script>
/* ====== CONFIGURAÇÃO ======
   Coloque 1.mp3 ... 8.mp3 na mesma pasta deste index.html.
   Troque os rótulos abaixo pelo tema de cada áudio
   (ou use o botão "Editar nomes" no app). */
const AUDIOS = [
  {file:"7.mp3", label:"Varredura E1: capturados", pauses:[[2.05,2.48],[2.88,3.24],[5.75,6.13],[16.20,16.46],[23.21,23.66]]},
  {file:"1.mp3", label:"Situação do Capitão Bruno", pauses:[[2.15,2.48],[4.18,4.45],[9.07,9.44]]},
  {file:"6.mp3", label:"QSE confirmado", pauses:[]},
  {file:"2.mp3", label:"Sem resposta do Capitão", pauses:[[2.01,2.48],[6.21,6.73],[8.11,8.57]]},
  {file:"3.mp3", label:"Capitão alvejado?", pauses:[[1.86,2.48],[4.99,5.63],[9.68,10.05]]},
  {file:"4.mp3", label:"Resgate e local E3", pauses:[[1.81,2.28],[3.10,3.37],[4.07,4.35],[11.38,11.74]]},
  {file:"8.mp3", label:"Primeiros socorros", pauses:[[2.26,2.95]]},
  {file:"5.mp3", label:"Capitão fora de combate", pauses:[[3.52,4.40],[6.91,7.27],[11.76,12.33],[17.18,17.57],[22.92,23.38]]}
];
/* ========================== */

const $ = id => document.getElementById(id);
const KEY = "baofeng777s-labels-v3";
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) s.forEach((l,i)=>{ if (l && AUDIOS[i]) AUDIOS[i].label = l; }); } catch(e){}
const saveLabels = () => { try { localStorage.setItem(KEY, JSON.stringify(AUDIOS.map(a=>a.label))); } catch(e){} };

let pi = 0, windGain, nextCrk = 0, nextGust = 0, ctx, noiseBuf, hissGain, current = -1, editing = false, token = 0, raf = 0;
const el = new Audio(); el.preload = "auto"; el.crossOrigin = "anonymous";

function initAudio(){
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  // voz com timbre de rádio: banda estreita + leve saturação
  const src = ctx.createMediaElementSource(el);
  const hp = ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=380;
  const lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2900;
  const sh = ctx.createWaveShaper();
  const c = new Float32Array(256);
  for (let i=0;i<256;i++){ const x=i/128-1; c[i]=Math.tanh(x*2.2); }
  sh.curve = c;
  const g = ctx.createGain(); g.gain.value = 1.4;
  src.connect(hp); hp.connect(lp); lp.connect(sh); sh.connect(g); g.connect(ctx.destination);
  // chiado contínuo durante a recepção
  const hs = ctx.createBufferSource(); hs.buffer = noiseBuf; hs.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2000; bp.Q.value=.4;
  hissGain = ctx.createGain(); hissGain.gain.value = 0;
  hs.connect(bp); bp.connect(hissGain); hissGain.connect(ctx.destination); hs.start();
  // vento: ruído grave com rajadas lentas
  const ws = ctx.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
  const wl = ctx.createBiquadFilter(); wl.type="lowpass"; wl.frequency.value=520; wl.Q.value=1.2;
  const wb = ctx.createBiquadFilter(); wb.type="bandpass"; wb.frequency.value=260; wb.Q.value=.35;
  windGain = ctx.createGain(); windGain.gain.value = 0;
  // oscilação lenta aplicada ANTES do ganho principal, para o vento calar de vez quando windGain = 0
  const mod = ctx.createGain(); mod.gain.value = .7;
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = .18; lg.gain.value = .3; lfo.connect(lg); lg.connect(mod.gain); lfo.start();
  ws.connect(wl); wl.connect(wb); wb.connect(mod); mod.connect(windGain); windGain.connect(ctx.destination); ws.start(0, .7);
}

function burst(dur, vol){            // chiado curto (squelch)
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2200; bp.Q.value=.5;
  const g = ctx.createGain(), t = ctx.currentTime;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  s.connect(bp); bp.connect(g); g.connect(ctx.destination);
  s.start(t, Math.random()); s.stop(t+dur);
}
function beep(freq, dur, vol){        // tom de PTT
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.005);
  g.gain.setValueAtTime(vol, t+dur-.01); g.gain.linearRampToValueAtTime(0, t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.02);
}
function pttPause(len){            // PTT solta e aperta na pausa do áudio
  burst(.1, .3); beep(1400, .05, .12);
  const gap = Math.max(0, len - .1);
  setTimeout(()=>{ if (ctx){ beep(1000, .05, .12); burst(.08, .25); } }, gap*1000);
}
function windOff(rampo){            // corta o vento de vez: cancela rajadas agendadas e zera
  if (!windGain || !ctx) return;
  const g = windGain.gain, t = ctx.currentTime;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + (rampo || .25));
}
const wait = ms => new Promise(r => setTimeout(r, ms));

function setUI(state, i){
  $("led").className = "led " + (state==="rx" ? "rx" : state==="tx" ? "tx" : "");
  $("st").textContent = state==="rx" ? "RX" : state==="tx" ? "TX" : "STANDBY";
  document.querySelectorAll(".key").forEach((k,n)=>k.classList.toggle("act", n===i && state!=="idle"));
  if (state==="idle"){ $("bars").querySelectorAll("i").forEach(b=>b.classList.remove("on")); $("prog").style.width="0"; }
}
function tick(tk){
  if (tk !== token) return;
  const d = el.duration || 1;
  $("prog").style.width = (el.currentTime/d*100) + "%";
  const m = Math.floor(el.currentTime/60), s = Math.floor(el.currentTime%60);
  $("time").textContent = m + ":" + String(s).padStart(2,"0");
  const P = AUDIOS[current] && AUDIOS[current].pauses || [];
  while (pi < P.length && el.currentTime >= P[pi][0]){
    const [a0,a1] = P[pi]; pi++;
    if (el.currentTime - a0 < .4) pttPause(a1 - a0);
  }
  const now = ctx.currentTime;
  if (!el.paused && now >= nextGust){ windGain.gain.setTargetAtTime(.09 + Math.random()*.14, now, .9); nextGust = now + 1.5 + Math.random()*3; }
  if (now >= nextCrk){                       // chiado leve de vez em quando
    burst(.05 + Math.random()*.18, .05 + Math.random()*.1);
    if (Math.random() < .3) setTimeout(()=>{ if (ctx && el && !el.paused) burst(.04, .07); }, 90);
    nextCrk = now + 1.2 + Math.random()*3.5;
  }
  const lvl = 2 + Math.floor(Math.random()*3);
  $("bars").querySelectorAll("i").forEach((b,n)=>b.classList.toggle("on", n<lvl));
  if (hissGain) hissGain.gain.setTargetAtTime(.025 + Math.random()*.03, ctx.currentTime, .05);
  raf = requestAnimationFrame(()=>tick(tk));
}

async function play(i){
  initAudio();
  if (ctx.state === "suspended") await ctx.resume();
  stopAll(true);
  const tk = ++token; current = i;
  $("ch").textContent = "CH" + String(i+1).padStart(2,"0");
  $("name").textContent = AUDIOS[i].label;
  $("hint").textContent = "";
  setUI("tx", i);                      // PTT acionado
  burst(.28, .35); beep(1000, .06, .12);
  await wait(320); if (tk !== token) return;
  el.src = AUDIOS[i].file; el.currentTime = 0; pi = 0;
  try { await el.play(); } catch(e){ setUI("idle"); $("hint").textContent = "Não foi possível tocar " + AUDIOS[i].file + ". Verifique se o arquivo está na pasta."; return; }
  if (tk !== token) return;
  nextGust = 0; nextCrk = ctx.currentTime + 1 + Math.random()*1.5;
  windGain.gain.setTargetAtTime(.14, ctx.currentTime, .4);
  setUI("rx", i); tick(tk);
  el.onended = async () => {           // PTT desacionado
    if (tk !== token) return;
    cancelAnimationFrame(raf);
    hissGain.gain.setTargetAtTime(0, ctx.currentTime, .02);
    windOff(.3);
    setUI("tx", i);
    beep(1400, .1, .14); burst(.45, .4);
    await wait(550); if (tk !== token) return;
    current = -1; setUI("idle"); $("time").textContent = "0:00";
  };
  el.onerror = () => { if (tk===token){ setUI("idle"); $("hint").textContent = "Arquivo " + AUDIOS[i].file + " não encontrado."; } };
}
function stopAll(silent){
  token++; cancelAnimationFrame(raf); el.onended = null; el.pause();
  if (hissGain) hissGain.gain.setTargetAtTime(0, ctx.currentTime, .02);
  windOff(.15);
  if (!silent && ctx){ burst(.25,.3); beep(1400,.08,.12); }
  current = -1; setUI("idle");
}

AUDIOS.forEach((a,i)=>{
  const b = document.createElement("button");
  b.className = "key"; b.type = "button";
  b.innerHTML = '<span class="n">CH' + String(i+1).padStart(2,"0") + '</span><span class="l"></span>';
  b.querySelector(".l").textContent = a.label;
  b.onclick = () => {
    if (editing){
      const v = prompt("Nome do canal " + (i+1) + ":", a.label);
      if (v && v.trim()){ a.label = v.trim().slice(0,40); b.querySelector(".l").textContent = a.label; saveLabels(); }
      return;
    }
    play(i);
  };
  $("grid").appendChild(b);
});
$("stop").onclick = () => { if (ctx) stopAll(false); };
$("edit").onclick = () => {
  editing = !editing; $("edit").classList.toggle("on", editing);
  $("edit").textContent = editing ? "Concluir" : "Editar nomes";
  $("hint").textContent = editing ? "Toque em um canal para renomear." : "";
};

// uso offline: guarda tudo no aparelho na primeira visita com internet
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{
    if (!$("hint").textContent) $("hint").textContent = "Pronto para usar sem internet.";
  }).catch(()=>{});
}
</script>
</body>
</html>
